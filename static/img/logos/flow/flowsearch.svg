<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search">

          <defs>
            <!-- userSpaceOnUse ensures a single continuous color space across the whole icon grid -->
            <linearGradient id="continuous-gradient1" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ff007f"></stop> <!-- Color at top-left (Circle area) -->
              <stop offset="50%" stop-color="#7928ca"></stop> <!-- Color transition zone -->
              <stop offset="100%" stop-color="#00dfd8"></stop> <!-- Color at bottom-right (Handle tip) -->
            </linearGradient>
          </defs>

          <!-- Grouping the shapes applies the gradient seamlessly across both joined elements -->
          <g stroke="url(#continuous-gradient1)" stroke-width="1.75">
            <path d="m21 21-4.34-4.34"></path>
            <circle cx="11" cy="11" r="8"></circle>
          </g>
        </svg>